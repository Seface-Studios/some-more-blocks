plugins {
  id 'some-more-loaders'
  id 'idea'
  id 'eclipse'
  id 'net.minecraftforge.gradle'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(project_jdk.toInteger())

jar {
  manifest {
    attributes(
      'MixinConfigs': "${mod_id}.mixins.json,${mod_id}.forge.mixins.json"
    )
  }
}

minecraft {
  runs {
    configureEach {
      workingDir = layout.projectDirectory.dir('run')

      systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
      systemProperty 'forge.enabledGameTestNamespaces', mod_id

      /* FG7 SlimeLauncher: Manifest MixinConfigs is not enough in DevEnv */
      args "-mixin.config=${mod_id}.mixins.json"
      args "-mixin.config=${mod_id}.forge.mixins.json"
    }

    register('client')

    register('server') {
      args '--nogui'
    }

    register('gameTestServer')

    register('data') {
      workingDir = layout.projectDirectory.dir('run-data')

      args '--mod', mod_id, '--all',
        '--output', layout.projectDirectory.dir('src/generated/resources'),
        '--existing', layout.projectDirectory.dir('src/main/resources')
    }
  }
}

repositories {
  minecraft.mavenizer(it)
  maven fg.forgeMaven
  maven fg.minecraftLibsMaven
  mavenCentral()
}

dependencies {
  implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
  annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.1'
}

tasks.withType(JavaCompile).configureEach {
  options.encoding = 'UTF-8'
}

/* Workaround ForgeGradle 7.0.35 + Gradle 9.x:
 * slimeLauncherMetadataForForge falha ao ler runsJson = outputDirectory.map(...) no @TaskAction.
 * Definimos runsJson com um caminho fixo (sem map da própria output). */
afterEvaluate {
  tasks.named('slimeLauncherMetadataForForge').configure {
    def metaDir = layout.buildDirectory.dir('minecraftforge/forgegradle/slimeLauncherMetadataForForge')
    outputDirectory.set(metaDir)
    runsJson.set(layout.buildDirectory.file('minecraftforge/forgegradle/slimeLauncherMetadataForForge/launcher/runs.json'))
  }
}

final loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements'].each { variant ->
  configurations.named(variant) {
    attributes {
      attribute(loaderAttribute, 'forge')
    }
  }
}

sourceSets.configureEach {
  [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
    configurations.named(variant) {
      attributes {
        attribute(loaderAttribute, 'forge')
      }
    }
  }
}
